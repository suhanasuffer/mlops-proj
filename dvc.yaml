stages:
  download_data:
    cmd: python script/download_data.py
    outs:
      - data/raw

  preprocess_data:
    cmd: python script/preprocess_data.py
    deps:
      - script/preprocess_data.py
      - data/raw
    params:
      - data.raw_dir
      - data.processed_dir
      - data.train_split
      - data.val_split
      - data.shuffle_data
    outs:
      - data/processed

  analyze_damage:
    cmd: python script/analyze_damage.py
    deps:
      - script/analyze_damage.py
      - models/autoencoder_model.h5
      - data/processed
    params:
      - data
      - training
      - squiggliness
    outs:
      - reports/autoencoder_evaluation.json
      - reports/reconstruction_errors.json
      - reports/reconstruction_error_hist.png
      - reports/confusion_matrix_autoencoder.png

  train_model:
    cmd: python script/train_model.py
    deps:
      - script/train_model.py
      - data/processed
      - params.yaml
    params:
      - training
    outs:
      - models/autoencoder_model.h5

  evaluate_threshold:
    cmd: python script/evaluate_threshold.py
    deps:
      - script/evaluate_threshold.py
      - reports/autoencoder_evaluation.json
      - reports/reconstruction_errors.json
    outs:
      - results/metrics/threshold_eval.json
      - results/figures/reconstruction_hist.png
      - results/figures/reconstruction_boxplot.png

  package_model:
    cmd: python script/package_model.py
    deps:
      - script/package_model.py
      - models/autoencoder_model.h5
    outs:
      - deploy/model_package.tar.gz
