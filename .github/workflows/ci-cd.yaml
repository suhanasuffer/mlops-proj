name: CI-CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install dvc[s3] pytest

      - name: Run DVC pipeline
        run: dvc repro

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t mlops-proj .

      # --- Deployment to EC2 ---
      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/mlops-proj"

      - name: SSH into EC2 and run container
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mlops-proj
            docker stop mlops-proj || true
            docker rm mlops-proj || true
            docker build -t mlops-proj .
            docker run -d -p 8501:8501 --name mlops-proj mlops-proj
